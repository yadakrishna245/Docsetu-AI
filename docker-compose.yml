version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docsetu-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    networks:
      - docsetu-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docsetu-frontend
    ports:
      - "3000:80"
    networks:
      - docsetu-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: docsetu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docsetu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

networks:
  docsetu-network:
    driver: bridge

volumes:
  uploads_data:
    driver: local
  db_data:
    driver: local
  redis_data:
    driver: local
